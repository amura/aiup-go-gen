mcp_tools:
- name: stripe_mcp
  endpoint: http://localhost:8080
  description: >
    Use this tool to interact with the Stripe MCP API (customer, charge, payment intent, etc.) only when payment related features are required and stripe is mentioned as the platform.
  operations:
    - name: create_customer
      path: /v1/customers
      method: POST
      description: Create a Stripe customer
      example_args:
        email: user@example.com
      parameters:
        type: object
        properties:
          email:
            type: string
            description: Customer's email address.
          name:
            type: string
            description: Customer's full name.
        required:
          - email
    - name: create_payment_intent
      path: /v1/payment_intents
      method: POST
      description: Create a new payment intent
      example_args:
        amount: 5000
        currency: usd
      parameters:
        type: object
        properties:
          amount:
            type: integer
            description: Amount in smallest currency unit (e.g. cents).
          currency:
            type: string
            description: Three-letter ISO currency code, in lowercase.
        required:
          - amount
          - currency

- name: docker_exec
  operations:
    - name: docker_exec
      description: Writes out all the code files provided in code_blocks to disk following hierarchical file paths. Overwrites any existing matching files.  Executes the code  in a docker container by running bash scripta provided in the 'init' argument for setting up e.g. creation of project, and  'launch' argument for serving up application e.g ng serve.
      example_args:
        code_blocks:
          - |
            ```bash
            # filename: test.sh
            echo "Hello world"
            ```
          - |
            ```bash
            # filename: init.sh
            apt-get update && apt-get install -y nodejs
            ```
          - |
            ```bash
            # filename: launch.sh
            ng serve --host
            ```
        init: "init.sh"
        launch: "test.sh"
        timeout: "90"
      parameters:
        type: object
        properties:
          language:
            type: string
            description: The language or environment (e.g., python, bash, dotnet, angular)
          code_blocks:
            type: array
            description: List of code files to execute, each with language, filename, and full code.
            items:
                type: object
                properties:
                  language:
                    type: string
                    description: File language (e.g., python, bash, sh, typescript)
                  filename:
                    type: string
                    description: Name and full relative path to the code file (e.g., main.py, app\start.sh, app\user-login\user-login.component.ts ....). Existing files will be overwritten.
                  code:
                    type: string
                    description: The full code/content of the file.
                required:
                  - language
                  - filename
                  - code
          init:
            type: ["string", "null"]
            description: Initialization command or script to execute which is included in code_blocks.
          launch:
            type: ["string", "null"]
            description: Launch command e.g. ng serve, dotnet run or shell script to execute such as launch.sh (ensure chmod +x) which should be included in code_blocks. 
          timeout:
            type: number
            description: The max timeout in seconds for which either launch or init commands should be executed before termination. Avoids waiting for ever.
          docker_file:
            type: string
            description: Optional Dockerfile content if a custom image is needed.
          ports:
            type: array
            items:
              type: string
              description: Optional port mapping to expose for the docker container, useful for web applications. e.g. 4205:80
        required:
          - language
          - code_blocks
          - init
          - launch
- name: dagger_exec
  operations:
    - name: dagger_exec
      description: Execute and validate code blocks by executing them in a docker container via dagger. Ensure to include initialization and launch scripts to install dependencies needed and then launch the solution.
      example_args:
        code_blocks:
          - |
            ```bash
            # filename: test.sh
            echo "Hello world"
            ```
          - |
            ```bash
            # filename: init.sh
            apt-get update && apt-get install -y nodejs
            ```
        init: "init.sh"
        launch: "test.sh"
        timeout: "90"
        ports: ["4205:80"]
      parameters:
        type: object
        properties:
          language:
            type: string
            description: The language or environment (e.g., python, bash, dotnet, angular)
          code_blocks:
            type: array
            description: List of code files to execute, each with language, filename, and code, including init and launch scripts.
            items:
                type: object
                properties:
                  language:
                    type: string
                    description: File language (e.g., python, bash, sh, typescript)
                  filename:
                    type: string
                    description: Name and full path of the code file (e.g., main.py, app\start.sh)
                  code:
                    type: string
                    description: The full code/content of the file.
                required:
                  - language
                  - filename
                  - code
          init:
            type: ["string", "null"]
            description: Optional initialization command or script to execute which is included in code_blocks.
          launch:
            type: ["string", "null"]
            description: Optional launch command e.g. ng serve, dotnet run or shell script to execute such as launch.sh (ensure chmod +x) which should be included in code_blocks. 
          timeout:
            type: number
            description: The max timeout in seconds for which either launch or init commands should be executed before termination. Avoids waiting for ever.
          docker_file:
            type: string
            description: Optional Dockerfile content if a custom image is needed.
        required:
          - language
          - code_blocks
          - init
          - launch

- name: file_tree
  operations:
    - name: list_files
      description: List files and directories in a tree structure using the tree command. Useful for exploring project structure and file organization.
      example_args:
        path: "/app"
        max_depth: 3
        show_hidden: false
        directories_only: false
      parameters:
        type: object
        properties:
          path:
            type: string
            description: The directory path to list (default is current directory)
            default: "."
          max_depth:
            type: integer
            description: Maximum depth to traverse (default is unlimited)
          show_hidden:
            type: boolean
            description: Whether to show hidden files and directories (default is false)
            default: false
          directories_only:
            type: boolean
            description: Whether to show only directories (default is false)
            default: false
          pattern:
            type: string
            description: File pattern to match (e.g., "*.go", "*.js")
          exclude_pattern:
            type: string
            description: Pattern to exclude from results (e.g., "node_modules")
          file_size:
            type: boolean
            description: Whether to show file sizes (default is false)
            default: false
        required: []

